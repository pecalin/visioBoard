<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VisioBoard: plan perfboard prototypes in 3D. Place dev boards, sensors and passives, wire them up and trace nets." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VisioBoard</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">
          <img src="./favicon.svg" alt="" width="22" height="22" />
          <span>VisioBoard</span>
        </div>
        <input id="name" class="name" type="text" spellcheck="false" aria-label="Design name" />
        <div class="group" id="tools">
          <button data-tool="select" title="Select and move (V)">Select</button>
          <button data-tool="wire" title="Jumper wire between two holes (W)">Wire</button>
          <button data-tool="bridge" title="Solder bridge along a line of pads (B)">Bridge</button>
          <button data-tool="erase" title="Erase (E)">Erase</button>
        </div>
        <div class="group" id="colors" title="Wire colour"></div>
        <div class="group">
          <button id="view-top" title="Look at the component side">Top</button>
          <button id="view-bottom" title="Flip to the solder side">Bottom</button>
          <button id="view-3d" title="Angled view">3D</button>
          <button id="grid" title="Show or hide the grid around the board (G)">Grid</button>
        </div>
        <div class="group">
          <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
          <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
        </div>
        <div class="spacer"></div>
        <div class="group">
          <button id="new">New</button>
          <button id="example">Example</button>
          <button id="open" title="Open a saved .visioboard.json file">Open</button>
          <button id="save" title="Download the design as a file">Save</button>
          <button id="png" title="Download a picture of the current view">PNG</button>
        </div>
        <input id="file" type="file" accept=".json,application/json" hidden />
      </header>

      <aside id="palette">
        <input id="search" type="search" placeholder="Search parts…" aria-label="Search parts" />
        <div id="partlist"></div>
      </aside>

      <main id="viewport">
        <div id="side"></div>
        <div id="tooltip" hidden></div>
        <div id="drop" hidden>Drop a VisioBoard file to open it</div>
      </main>

      <aside id="inspector"></aside>

      <footer id="status">
        <span id="message"></span>
        <span class="hint">Drag: orbit · Right-drag: pan · Wheel: zoom · R: rotate · F: flip side · G: grid · Del: delete</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
